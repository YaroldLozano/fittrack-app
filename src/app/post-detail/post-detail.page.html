<ion-content class="page">
  <div class="page-header">
    <h1>
      <button class="back-link" (click)="goBack()"><ion-icon name="chevron-back"></ion-icon></button>
      Publicación
    </h1>
    <div class="header-actions" *ngIf="isMine && post && !isEditing">
      <button class="btn-secondary" (click)="startEdit()">Editar</button>
      <button class="btn-secondary" (click)="deletePost()">Eliminar</button>
    </div>
  </div>

  <div class="skeleton" *ngIf="isLoading">Cargando…</div>

  <ng-container *ngIf="!isLoading && post">
    <div class="post-header" (click)="openAuthor(post.author.id)">
      <app-avatar [mediaId]="post.author.avatar_media_id" [username]="post.author.username"></app-avatar>
      <div class="post-header-info">
        <span class="post-author-name">{{ post.author.username }}</span>
        <span class="post-time">{{ post.created_at | date: 'medium' }} · {{ post.visibility }}</span>
      </div>
    </div>

    <ng-container *ngIf="!isEditing">
      <p class="post-caption" *ngIf="post.caption">{{ post.caption }}</p>
    </ng-container>

    <div class="edit-form" *ngIf="isEditing">
      <textarea [(ngModel)]="editCaption" rows="3" maxlength="2000"></textarea>
      <div class="filter-row">
        <button class="btn-secondary" [class.active]="editVisibility === 'public'" (click)="editVisibility = 'public'">Público</button>
        <button class="btn-secondary" [class.active]="editVisibility === 'friends'" (click)="editVisibility = 'friends'">Amigos</button>
        <button class="btn-secondary" [class.active]="editVisibility === 'private'" (click)="editVisibility = 'private'">Privado</button>
      </div>
      <p class="error" *ngIf="error">{{ error }}</p>
      <div class="filter-row">
        <button class="btn-primary" [disabled]="isSaving" (click)="saveEdit()">{{ isSaving ? 'Guardando…' : 'Guardar' }}</button>
        <button class="btn-secondary" (click)="isEditing = false">Cancelar</button>
      </div>
    </div>

    <div class="post-media" *ngIf="post.media.length > 0">
      <img *ngIf="post.media[0].type === 'image'" [secureSrc]="post.media[0].id" alt="" />
      <video *ngIf="post.media[0].type === 'video'" [secureSrc]="post.media[0].id" controls preload="metadata"></video>
    </div>

    <div class="post-actions">
      <button class="post-action" [class.liked]="post.liked_by_me" (click)="toggleLike()">
        <ion-icon [name]="post.liked_by_me ? 'heart' : 'heart-outline'"></ion-icon>
        {{ post.like_count }}
      </button>
      <span class="post-action static">
        <ion-icon name="chatbubble-outline"></ion-icon>
        {{ post.comment_count }}
      </span>
    </div>

    <div class="comments-section">
      <div class="comment-row" *ngFor="let c of comments">
        <app-avatar [mediaId]="c.avatar_media_id" [username]="c.username" size="sm"></app-avatar>
        <div class="comment-body">
          <span class="comment-author">{{ c.username }}</span>
          <p class="comment-text">{{ c.comment }}</p>
          <span class="comment-time">{{ c.created_at | date: 'short' }}</span>
        </div>
        <button class="comment-delete" *ngIf="c.user_id === myUserId" (click)="deleteComment(c)">✕</button>
      </div>
      <p class="empty" *ngIf="comments.length === 0">Sé el primero en comentar</p>
    </div>
  </ng-container>

  <div class="comment-composer" *ngIf="!isLoading && post">
    <input
      type="text"
      [(ngModel)]="draftComment"
      placeholder="Escribe un comentario…"
      maxlength="500"
      (keydown.enter)="sendComment()"
    />
    <button class="btn-primary" [disabled]="!draftComment.trim() || isSendingComment" (click)="sendComment()">
      Enviar
    </button>
  </div>
</ion-content>
